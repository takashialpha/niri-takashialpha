[workspace]
members = ["niri-config", "niri-ipc"]

[workspace.lints.rust]
unused_qualifications = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }

# not something easily fixable for a binary crate like this
multiple_crate_versions = "allow"
# panic/error
# contracts aren't consumed by external callers the way they would be for
# a crate on crates.io.
missing_panics_doc = "allow"
missing_errors_doc = "allow"

# Extra hygiene lints beyond the standard groups above.
# Forgotten debug prints never make it to a commit.
dbg_macro = "warn"
# libinput/GBM/EGL/DRM; every unsafe block
# should carry a `// SAFETY:` comment explaining the invariant that makes it
# sound, the same way `render_helpers` already documents its casts.
undocumented_unsafe_blocks = "warn"

[workspace.package]
description = "[ALL CREDITS TO YaLTeR] A scrollable-tiling Wayland compositor (takashialpha's personal fork!)"
authors = [
  "Ivan Molodetskikh <yalterz@gmail.com>",
  "takashialpha <takashialpha@protonmail.com>",
]
# intentionally null; builds are identified by commit hash (see utils::version).
version = "0.0.0"
license = "GPL-3.0-or-later"
edition = "2024"
repository = "https://github.com/takashialpha/niri-takashialpha"

[workspace.dependencies]
anyhow = "1.0"
bitflags = "2.13"
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = { version = "0.1", features = [
  "max_level_trace",
  "release_max_level_debug",
] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.dependencies.smithay]
git = "https://github.com/Smithay/smithay.git"
rev = "ff5fa7df392cecfba049ffed55cdaa4e98a8e7ef"
default-features = false

[workspace.dependencies.smithay-drm-extras]
git = "https://github.com/Smithay/smithay.git"
rev = "ff5fa7df392cecfba049ffed55cdaa4e98a8e7ef"

[package]
name = "niri"
version.workspace = true
description.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
repository.workspace = true

readme = "README.md"
keywords = ["wayland", "compositor", "tiling", "smithay", "wm"]
categories = ["gui", "os::linux-apis"]

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
arrayvec = "0.7"
async-channel = "2.5"
bitflags.workspace = true
calloop = { version = "0.14", features = ["executor", "futures-io", "signals"] }
clap = { workspace = true, features = ["string"] }
drm-ffi = "0.9"
fastrand = "2.5"
futures-util = { version = "0.3", default-features = false, features = [
  "std",
  "io",
] }
git-version = "0.3"
glam = "0.33"
input = { version = "0.10", features = ["libinput_1_30"] }
keyframe = { version = "1.1", default-features = false }
libc = "0.2"
libdisplay-info = "0.3"
niri-config = { path = "niri-config" }
niri-ipc = { path = "niri-ipc" }
ordered-float = "5.3"
pango = { version = "0.22", features = ["v1_44"] }
pangocairo = "0.22"
png = "0.18"
serde_json.workspace = true
smithay-drm-extras.workspace = true
tracing-subscriber.workspace = true
tracing.workspace = true
wayland-backend = "0.3"
wayland-server = "0.31"
xcursor = "0.3"
xdg = "3.0"

[dependencies.smithay]
workspace = true
features = [
  "backend_drm",
  "backend_egl",
  "backend_gbm",
  "backend_libinput",
  "backend_session_libseat",
  "backend_udev",
  "desktop",
  "renderer_gl",
  "renderer_pixman",
  "renderer_multi",
  "use_system_lib",
  "wayland_frontend",
]

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
# overflow-checks = true # might want enabled
