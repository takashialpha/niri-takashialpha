name: Rust

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 0"

env:
  CARGO_TERM_COLOR: always
  # System libraries niri links against. Mirrors upstream niri's CI.
  DEPS_APT: >-
    curl gcc clang libudev-dev libgbm-dev libxkbcommon-dev libegl1-mesa-dev
    libwayland-dev libinput-dev libdbus-1-dev libsystemd-dev libseat-dev
    libpipewire-0.3-dev libpango1.0-dev libdisplay-info-dev

jobs:
  test:
    name: Test, Fmt, Clippy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ${{ env.DEPS_APT }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --verbose

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
