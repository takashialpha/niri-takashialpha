[package]
name = "vulkan-spike"
version.workspace = true
description = "Standalone spike: wgpu-on-Vulkan renderer driving Smithay's DrmCompositor"
authors.workspace = true
license.workspace = true
edition.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
ash = "0.38"
smithay-drm-extras.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
wgpu = { version = "30", default-features = false, features = ["vulkan"] }

[dependencies.smithay]
workspace = true
features = [
  "backend_drm",
  "backend_gbm",
  "backend_session_libseat",
  "backend_udev",
  "backend_vulkan",
  # `backend::drm::compositor` (DrmCompositor) is gated on this too, not
  # just backend_drm/backend_gbm.
  "wayland_frontend",
]
